usage : |-
  ### Simple Example
  Here is an example of how you can use this module in your inventory structure:
  ```hcl
  module "nfs" {
  source = "terraform-do-modules/nfs/digitalocean"
  name             = "app"
  environment      = "dev"
  region           = "blr1"
  size             = 50
  vpc_id           = "vpc-xxxx"
  performance_tier = "high"
}
  ```

  ### Deploy with Terraform
  ```bash
  terraform init
  terraform plan
  terraform apply
  ```

  ### Deploy with OpenTofu
  ```bash
  tofu init
  tofu plan
  tofu apply
  ```